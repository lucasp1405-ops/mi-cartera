name: Revisar noticias de la cartera

# Corre solo, cada 20 minutos, aunque nadie tenga la app abierta. Si encuentra noticias
# nuevas de alguna empresa de la cartera, le pide a OneSignal que mande el aviso push —
# eso es lo que hace que llegue incluso con el teléfono bloqueado o la app cerrada.
#
# Nota: si el repositorio pasa 60 días sin ningún commit, GitHub pausa automáticamente
# los workflows programados. Si eso pasa, basta con entrar a la pestaña "Actions" de este
# repo y volver a activarlo.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-news
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar noticias y avisar por OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/check-news.mjs

      - name: Guardar qué noticias ya se avisaron
        run: |
          git config user.name "mi-cartera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/seen-news.json
          git diff --staged --quiet || git commit -m "Actualizar noticias ya vistas [skip ci]"
          git push
